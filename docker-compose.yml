services:
  app:
    build: .
    image: scenic-shuttle:latest
    container_name: scenic-shuttle
    ports:
      - "3001:3001"
    volumes:
      - scenic-sqlite:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/overview').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  scenic-sqlite:
